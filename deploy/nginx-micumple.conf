# /etc/nginx/sites-available/micumple.zenti.cl
# certbot --nginx agrega el bloque HTTPS automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name micumple.zenti.cl;

    root /var/www/micumple/public;
    index index.html;

    # Que no aparezca en buscadores
    add_header X-Robots-Tag "noindex, nofollow" always;

    # No guardar caché del HTML, así cada cambio se ve al tiro
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Nunca servir archivos ocultos (.git, etc.)
    location ~ /\. {
        deny all;
    }
}
